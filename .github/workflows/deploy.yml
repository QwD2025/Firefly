name: Deploy forum to Pages branch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forum/package-lock.json
      - run: npm ci
        working-directory: forum
      - run: npm run build
        working-directory: forum
      - run: touch forum/dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages
          folder: forum/dist
          clean-exclude: CNAME
